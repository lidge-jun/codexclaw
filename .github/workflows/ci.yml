name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # macOS is the primary development platform and was the only untested one;
        # a path-case or BSD-tool difference would otherwise ship undetected.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # autocrlf=true is what a default Windows git install does, and it is the
        # configuration that turns CRLF-safe-today readers into broken ones.
        # Testing only the eol=lf checkout tests a machine our users do not have.
        autocrlf: [false]
        include:
          - os: windows-latest
            autocrlf: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # GitHub runners preinstall uv, which would flip the repo-map smoke test
      # from skip to a live network dependency resolve. Keep CI deterministic.
      CODEXCLAW_SKIP_REPOMAP_SMOKE: "1"
    steps:
      - name: Configure line endings
        run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Measure the suite ONCE and reuse the total. bash is pinned on purpose: the
      # windows runners default to PowerShell, which does not propagate a pipeline's
      # exit status, so `npm test | tee` there would report success over a failing
      # suite. Same TAP grammar as release.yml, so one parser serves both callers.
      - name: Run the suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/ci-suite.log
          total="$(grep -Eo '^. tests [0-9]+' /tmp/ci-suite.log | tail -1 | grep -Eo '[0-9]+')"
          if [ -z "$total" ]; then
            echo "could not parse a test total out of the suite output" >&2
            exit 1
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
      # The tests badge is the one published count that cannot be derived from the
      # payload, so it is checked against what the suite just measured. Skipping this
      # is how 2,026 survived three versions and stopped the release gate instead.
      - name: Inventory and published counts
        shell: bash
        run: |
          set -euo pipefail
          node plugins/codexclaw/scripts/inventory.mjs --check --tests "${{ steps.suite.outputs.total }}"
      - run: node plugins/codexclaw/scripts/gate.mjs
      # The suites above are largely pure-function suites. This executes the spawn
      # ladders, the bench, and the bundle - the surfaces where the audited win32
      # defects lived (devlog/_plan/260821_win-linux-optimization/002).
      - name: Platform smoke
        run: node plugins/codexclaw/scripts/platform-smoke.mjs
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.os }}-crlf${{ matrix.autocrlf }}
          path: .codexclaw/evidence/
          if-no-files-found: warn
