name: WSL

# A real WSL2 kernel on a Windows runner: /proc/version carries "microsoft" and
# /proc/mounts reports drvfs for the checkout, the two signals wp07 keys on that
# ubuntu-latest cannot produce. At 13-14 minutes this is the longest lane in the
# repository, and it proves an installation property rather than a code-review
# property, so it runs on the integration lines and on demand, not on every
# pull request (cxc-dev-devops §2.1). A regression surfaces on the dev push that
# merged it and is fixed forward.
on:
  push:
    branches: [main, preview, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two checkouts, deliberately, as two jobs so they run side by side. /mnt/c is
  # drvfs and is where the lock and publish guarantees get weaker; ~ is native
  # ext4 and is what the docs recommend. Both must pass, and the doctor must
  # TELL THEM APART.
  wsl-drvfs:
    name: wsl (drvfs /mnt/c)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates
      - name: Install Node in the distro
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node --version
      - name: Test on drvfs (/mnt/c)
        shell: wsl-bash {0}
        run: |
          cd "$(wslpath '${{ github.workspace }}')"
          npm ci
          npm test
          node bin/codexclaw.mjs doctor | grep -iE 'drvfs|9p|wsl'
      - name: No wsl.exe subprocess parsing
        shell: wsl-bash {0}
        run: |
          cd "$(wslpath '${{ github.workspace }}')"
          ! grep -rn "wsl\.exe\|wslpath" plugins/codexclaw/components plugins/codexclaw/scripts bin cli scripts \
            --include="*.ts" --include="*.mjs" --include="*.js" \
            | grep -v "/dist/" | grep -v "/test/" | grep -vE "^[^:]+:[0-9]+: *(//\|[*]\|/[*])" | grep -vE "^[^:]+:[0-9]+: *(//|\*|/\*)" || true

  wsl-ext4:
    name: wsl (native ext4 ~)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates
      - name: Install Node in the distro
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node --version
      - name: Test on native ext4 (~)
        shell: wsl-bash {0}
        run: |
          cp -r "$(wslpath '${{ github.workspace }}')" ~/codexclaw-native
          cd ~/codexclaw-native
          npm ci
          npm test
          node plugins/codexclaw/scripts/platform-smoke.mjs

