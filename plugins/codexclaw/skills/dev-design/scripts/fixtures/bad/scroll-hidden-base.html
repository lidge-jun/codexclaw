<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reveal test</title>
<style>
html { scroll-behavior: smooth; scroll-snap-type: y mandatory; }
.site-header { position: sticky; top: 0; }
.reveal { opacity: 0; }
@supports (animation-timeline: view()) {
  .reveal { animation-timeline: view(); animation: rise linear both; animation-range: 10% 40%; }
}
.bar { animation: grow linear both; animation-timeline: scroll(root); }
@keyframes rise { from { opacity: 0; translate: 0 2rem; } to { opacity: 1; } }
@keyframes grow { from { height: 0; } }
</style></head><body>
<header class="site-header"><nav><a href="#pricing">Pricing</a></nav></header>
<main><h1>Reveal test</h1><section id="pricing" class="reveal"><p>Plans start at the free tier.</p></section></main>
<script>
addEventListener('wheel', (e) => { e.preventDefault(); }, { passive: false });
window.addEventListener('scroll', () => { document.body.dataset.y = document.querySelector('main').getBoundingClientRect().top; });
</script>
</body></html>
