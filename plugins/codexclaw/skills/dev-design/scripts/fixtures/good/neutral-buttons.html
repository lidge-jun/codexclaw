<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>fixture</title><style>
:root { --fg: #1c1c1e; --bg: #fbfbfa; --s2: #f1f1ef; --line: #dcdcd7; --accent: #2B59C3; --ok: #2f7d4f; --danger: #d93b3b; }
.btn { background: var(--bg); color: var(--fg); border: 1px solid var(--line); height: 40px; padding: 0 16px; }
.btn:hover { background: var(--s2); }
.btn.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.btn-primary:hover { background: color-mix(in oklch, var(--fg) 86%, var(--bg)); }
/* brand-primary: brief names a cobalt download button (one per view) */
.btn-brand { background: var(--accent); color: #fff; border: 0; }
.toolbar-group { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--s2); }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p a { color: var(--accent); text-decoration: underline; }
.status-ok { color: var(--ok); }
</style></head><body>
<h1>GOAT. 모든 기기를 한 팀으로</h1>
<p>맥북에서 서버, 클라우드까지. 막히는 순간엔 휴대폰으로. <a href="#">문서</a></p>
<button class="btn btn-primary">다운로드</button><button class="btn">더 알아보기</button><button class="btn-brand" data-brand-primary>맥용 다운로드</button>
<div class="toolbar-group"><button class="icon-btn" aria-label="중지"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="7"/></svg></button></div>
<p class="status-ok">✓ 동기화됨</p></body></html>
