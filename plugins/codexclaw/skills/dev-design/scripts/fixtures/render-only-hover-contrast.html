<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>hover bug</title><style>
:root { --fg: #1c1c1e; --bg: #fbfbfa; --s2: #f1f1ef; --line: #dcdcd7; }
body { background: var(--bg); }
.btn { background: var(--bg); color: var(--fg); border: 1px solid var(--line); height: 40px; padding: 0 16px; }
.btn:hover { background: var(--s2); }
.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
</style></head><body><button class="btn btn-primary">다운로드</button></body></html>
